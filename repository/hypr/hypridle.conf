general {
    lock_cmd = quickshell -p /home/sheril/.config/quickshell/LockScreen.qml 
    before_sleep_cmd = quickshell -p /home/sheril/.config/quickshell/LockScreen.qml
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

listener {
    timeout = 150
    on-timeout = brightnessctl -s set 1
    on-resume = brightnessctl -r
}

listener {
    timeout = 300
    on-timeout = quickshell -p /home/sheril/.config/quickshell/LockScreen.qml
}

listener {
    timeout = 380
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}   
